{% extends "base.html" %}{% block c %}<h1>Users</h1><div class="grid"><form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required></label><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><label>Role<select name="role"><option>Admin</option><option>Production</option><option>Selling</option><option>Accounts</option></select></label><button>Add User</button></form><div class="card"><table>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.username}}</td><td>{{u.role}}</td></tr>{% endfor %}</table></div></div>{% endblock %}
