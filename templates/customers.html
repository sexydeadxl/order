{% extends "base.html" %}{% block c %}<h1>Customers</h1><div class="grid"><form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required></label><label>Phone<input name="phone"></label><label>GST<input name="gst"></label><label>Address<textarea name="address"></textarea></label><button>Add Customer</button></form><div class="card"><table><tr><th>Name</th><th>Phone</th><th>GST</th></tr>{% for x in customers %}<tr><td>{{x.name}}</td><td>{{x.phone}}</td><td>{{x.gst}}</td></tr>{% endfor %}</table></div></div>{% endblock %}
