{% extends "base.html" %}{% block c %}<h1>Reports</h1><div class="cards"><div class="card"><small>Total Sales</small><b>₹{{"%.2f"|format(sales)}}</b></div><div class="card"><small>Received</small><b>₹{{"%.2f"|format(received)}}</b></div><div class="card"><small>Pending</small><b>₹{{"%.2f"|format(pending)}}</b></div></div><div class="card"><h2>Activity</h2><table>{% for l in logs %}<tr><td>{{l.created_at.strftime("%d-%m %H:%M")}}</td><td>{{l.username}}</td><td>{{l.action}}</td></tr>{% endfor %}</table></div>{% endblock %}
